# Memorytree 插件（dsh-memorytree-rule）的加载行。
# id 与 name 是公开版的稳定标识，发布后不要改。
- insert:
    - id: memorytree-rule
      name: dsh-memorytree-rule
      config:
        # 数据目录；留空 = <DSH_HOME>/memory-tree
        dataDir: ''
        # 主干正本；留空 = <DSH_HOME>/AGENTS.md
        agentsPath: ''
        # 写入前做敏感串脱敏（sk-*/Bearer/密码赋值/邮箱/11 位以上数字）
        redact: true
        # 每次检索/查看树之前，若 AGENTS.md 变了就重新同步 §1 主干（15 秒节流）。
        autoSync: true
